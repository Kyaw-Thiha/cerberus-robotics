[workspace]
name = "cerberus"
version = "0.1.0"
description = "Cerberus: end-to-end quadruped robot learning stack"
channels = ["robostack-jazzy", "conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.12.*"
ros-jazzy-ros-base = "*"
colcon-common-extensions = "*"
ruff = "*"
pytest = "<8"
matplotlib = "*"
pandas = "*"
ros-jazzy-xacro = ">=2.1.1,<3"
onnxruntime = ">=1.29.0,<2"

[tasks]
build = "colcon build --symlink-install"
lint = "ruff check ."
test = "pytest"
