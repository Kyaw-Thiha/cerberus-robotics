[pytest]
# third_party/ holds vendored external SLAM backend source (scripts/fetch_slam_backends.py) -- gitignored, not ours, and some of it (e.g. ORB_SLAM3's
# bundled Sophus python bindings) fails to import locally (missing sympy etc.) and is not
# meant to be collected as test code at all. build/install/log are colcon artifacts,
# gitignored the same way. Without this, `pixi run pytest` breaks repo-wide the moment
# third_party/ exists on disk, unrelated to any real test failure.
norecursedirs = third_party build install log .git .pixi

# Repo root on sys.path (`from common...`) plus `scripts/` for the tests beside
# the ops scripts, which import their subject module by bare name.
pythonpath = . scripts

# The ament `launch_testing` plugin hijacks collection at the repo root: with it
# active, a root-level `pixi run test` collects 0 tests (or aborts on the first
# non-ROS test file it tries to import). We ship no `*.launch_test.py` files, so
# both ament pytest entry points are disabled here. Re-enable them (or move the
# launch tests into a package that carries its own pytest config) before adding
# the first ROS launch test.
#
# `--continue-on-collection-errors` keeps one unimportable module (a pod-only
# import such as isaaclab_tasks, or an unbuilt colcon msg package) from hiding
# the other ~900 tests. pytest still exits 1 when a collection error occurred.
addopts = -p no:launch_testing -p no:launch_ros --continue-on-collection-errors
