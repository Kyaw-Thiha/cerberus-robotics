# Minimal ruff config: ruff 0.16's default rule set, with the rule families that
# the repo already violates (baseline as of 2026-11-06) ignored so `pixi run lint`
# passes without a mass reformat. Burn this list down over time; do not add to it
# for new code.
#
# Burned down on 2026-11-08: I001 and RUF100 (42 mechanical fixes), plus UP035,
# PLR0402, C408, SIM118, SIM102, RUF015, PLW1510 and EXE001 (behaviour-neutral
# hand edits). Remaining ignores are the ones that need a judgement call.
extend-exclude = ["third_party", "build", "install", "log", "artifacts"]

[lint]
ignore = [
    "B008",    # function-call-in-default-argument
    "RUF059",  # unused-unpacked-variable
    "RUF012",  # mutable-class-default
    "DTZ005",  # call-datetime-now-without-tzinfo
    "F841",    # unused-variable
    "UP031",   # printf-string-formatting
    "S110",    # try-except-pass
    "TRY004",  # type-check-without-type-error
]
